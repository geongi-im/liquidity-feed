[project]
name = "liquidity-feed"
version = "0.1.0"
description = "FRED 유동성 지표 수집 및 MQWAY 게시물 생성"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pandas>=2.2",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 한국어 주석의 전각 문자 오탐 방지

[tool.pytest.ini_options]
testpaths = ["tests"]
