# 지표별 표기 용어와 해설 문구, 그리고 레이어별 임계치.
#
# 참고한 외부 대시보드의 판정 문구와 임계치는 그쪽 창작물이므로 복사하지 않는다.
# 여기 문구는 직접 쓴 것이고 코드와 분리해 관리한다. 게시물 문구를 고치고
# 싶으면 이 파일만 고치면 된다. render.py 는 문구를 갖고 있지 않다.
#
# term   화면에 그대로 쓰는 정식 용어. 이게 기본 표기다
# plain  툴팁 첫 줄에 쓰는 쉬운 말 한 마디
# gloss  툴팁 본문. 두세 줄 안에서 끝낸다

metrics:
  net_liquidity:
    term: 순유동성
    plain: 시장에 풀린 돈
    gloss: 연준이 공급한 돈에서 정부 금고에 잠긴 돈과 연준이 도로 흡수한 돈을 뺀 값.
      주식과 채권으로 흘러갈 수 있는 여윳돈의 크기로 본다.
  reserves:
    term: 지급준비금
    plain: 은행이 연준에 맡긴 돈
    gloss: 시중은행이 연준 계좌에 넣어둔 돈. 줄어들면 은행이 대출을 조이거나
      단기 금리가 튀는 원인이 된다.
  tga:
    term: 재무부 일반계정 TGA
    plain: 정부 금고
    gloss: 미국 정부가 연준에 둔 통장 잔고. 세금이 걷히면 늘고 정부가 돈을 쓰면 준다.
      늘어나는 동안은 그만큼 시장에서 돈이 빠진다.
  rrp:
    term: 익일물 역레포 RRP
    plain: 연준이 흡수한 돈
    gloss: 머니마켓펀드 등이 하루짜리로 연준에 맡겨둔 돈. 갈 곳 없는 자금이 쌓이는
      곳이라, 바닥나 있으면 여윳돈이 이미 시장으로 다 나갔다는 뜻이다.
  total_assets:
    term: 연준 총자산
    plain: 연준이 가진 자산
    gloss: 연준이 사들여 보유 중인 채권 등의 합계. 늘리면 돈을 푸는 것이고
      줄이면 거둬들이는 것이다.
  reserves_to_gdp:
    term: 지준 / GDP
    plain: 경제규모 대비 은행 예치금
    gloss: 은행이 연준에 맡긴 돈을 미국 1년 경제규모와 견준 비율.
      은행 시스템에 돈이 넉넉한지 가늠하는 잣대다.
  loan_to_deposit:
    term: 예대율
    plain: 예금 대비 대출
    gloss: 은행이 받은 예금 100원당 내준 대출 금액. 높을수록 은행이 공격적으로
      대출했다는 뜻이다.

# 표에 쓰는 시리즈별 용어와 해설. gloss 가 있으면 툴팁 버튼이 붙는다.
series:
  WRESBAL:
    term: 지급준비금 (주간평균)
    gloss: 시중은행이 연준 계좌에 넣어둔 돈. 수요일로 끝나는 한 주의 평균값이다.
  WRBWFRBL:
    term: 지급준비금 (수요일)
    gloss: 같은 지급준비금을 수요일 그 시점 잔액으로 찍은 값. 주간평균과 수치가 다르다.
  WDTGAL:
    term: 재무부 일반계정 TGA
    gloss: 미국 정부가 연준에 둔 통장 잔고. 수요일 시점값.
  RRPONTSYD:
    term: 익일물 역레포 RRP
    gloss: 하루짜리로 연준에 맡겨둔 돈. 원래 일간 지표이나 다른 항목과 맞추려고
      수요일 값을 싣는다.
  WALCL:
    term: 연준 총자산
    gloss: 연준이 보유한 자산 총계. 수요일 시점값.
  WSHOTSL:
    term: 보유 국채
    gloss: 연준이 보유한 미국 국채.
  WSHOMCB:
    term: 보유 MBS
    gloss: 주택담보대출을 묶어 만든 채권. 연준이 2008년 이후 대량 보유해 왔다.
  M2SL:
    term: M2 통화량
    gloss: 현금과 예금, 단기 금융상품까지 포함한 넓은 의미의 시중 통화량.
  TOTLL:
    term: 은행 총대출
    gloss: 미국 상업은행이 내준 대출과 리스 잔액 합계.
  DPSACBW027SBOG:
    term: 은행 예금
    gloss: 미국 상업은행이 보유한 예금 잔액 합계.
  MMMFFAQ027S:
    term: MMF 총자산
    gloss: 머니마켓펀드가 굴리는 자산 총액. 갈 곳을 찾는 단기 자금의 규모다.
  STLFSI4:
    term: 세인트루이스 금융스트레스지수
    gloss: 0 이 평균이다. 양수면 금융시장이 평소보다 긴장했다는 뜻이다.
  NFCI:
    term: 시카고 전미금융여건지수
    gloss: 0 이 평균이다. 음수면 돈 빌리기가 평소보다 수월하다는 뜻이다.
  SOFR:
    term: SOFR
    gloss: 국채를 담보로 하루 빌릴 때 금리. 미국 단기자금시장의 기준선이다.
  EFFR:
    term: 실효 연방기금금리
    gloss: 은행끼리 하루짜리로 주고받는 자금의 실제 평균 금리.
  DTB4WK:
    term: 4주물 국채 수익률
    gloss: 만기 4주짜리 미국 국채의 유통 수익률.

# 레이어별 임계치와 판정 문구.
# 아직 정의하지 않았다. 판정을 붙이려면 기준을 직접 세워야 하므로
# 현재 게시물은 사실과 변화량만 싣고 좋다/나쁘다 판단은 하지 않는다.
layers: {}
