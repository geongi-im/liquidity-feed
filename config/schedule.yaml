# 수집과 게시 일정.
#
# 주 1회 단일 실행이다. 수집과 게시를 나누지 않는다.
# FRED 가 호출마다 전체 히스토리를 주기 때문에 미리 모아둘 이유가 없고,
# 26개 시리즈 전량 수집이 30초면 끝난다.
#
# 토요일로 잡은 근거는 발표 일정이다. FRED 타임스탬프는 세인트루이스 연준
# 기준이라 미 중부시간이다.
#   H.4.1 (연준 총자산, TGA, 지준, 국채, MBS)  목 15:31 CT -> 금 05:31 KST (겨울 06:31)
#   H.8   (은행 대출, 예금, 상업용부동산)       금 15:18 CT -> 토 05:18 KST (겨울 06:18)
# 금요일에 돌리면 H.8 이 한 주 묵은 값으로 들어간다. 토요일이면 둘 다 최신이다.
# 08:00 으로 둔 것은 서머타임 때문이다. 여름 05:18, 겨울 06:18 양쪽을 덮는다.
#
# 주 2회(금/토)도 검토했으나 접었다. 금요일 실행의 목적이 토요일 장애 대비
# 사본뿐인데, 그 사본으로 게시하면 H.8 이 한 주 더 묵는다. 재시도로 푸는 게 낫다.

run:
  # 한국시간 기준. 실행기는 Windows 작업 스케줄러나 서버 cron 을 쓴다.
  timezone: Asia/Seoul
  cron: "0 8 * * 6"        # 매주 토요일 08:00
  description: 주 1회 수집부터 게시까지 한 번에 실행

  # 한 번 실행에서 순서대로 수행한다.
  steps: [fetch, derive, export, publish]

retry:
  # FRED 나 MQWAY 가 일시적으로 응답하지 않을 때.
  # 여기서도 실패하면 게시를 건너뛴다. 로그를 남기고 텔레그램으로 알린다.
  # 수동 재실행으로 복구한다. post.html 은 이미 저장돼 있어 다시 보내면 된다.
  attempts: 3
  delay_minutes: 30

  # 시리즈 단위 호출 실패는 별도다. FRED 는 구체적 rate limit 을 공개하지
  # 않으므로 호출 간 간격을 두고 429 / 5xx 는 지수 백오프로 재시도한다.
  request:
    call_delay_seconds: 0.5
    max_attempts: 4

notify:
  # 새벽에 조용히 실패하면 알 방법이 없다. 텔레그램으로 알린다.
  # 환경변수 TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID / TELEGRAM_CHAT_TEST_ID.
  # 알림 실패는 작업 실패가 아니다. 게시가 됐으면 성공으로 본다.
  on_success: true
  on_failure: true

retention:
  # data/raw 는 DB 가 아니라 단계 사이에 데이터를 넘기는 작업 파일이다.
  # 개정 비교에 직전 회차가 필요해서 몇 회분만 남긴다. 1회분이 약 4.5 MB 다.
  raw_runs: 8
